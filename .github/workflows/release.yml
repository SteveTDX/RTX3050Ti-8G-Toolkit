name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and pack
        shell: cmd
        run: pack_release.bat --ci

      - name: Show artefacts
        shell: cmd
        run: dir dist

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: RTX3050Ti-8G-Toolkit
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
